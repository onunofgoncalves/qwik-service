<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwik Service — Web chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel:#1B2A33;
  --steel-deep:#132029;
  --paper:#FFFFFF;
  --concrete-dim:#F4F2EE;
  --signal:#F2B705;
  --ink:#101A1F;
  --line:#CFCBC3;
  --line-dark:#2E3F49;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif;font-size:17px;line-height:1.6;
  display:flex;flex-direction:column;min-height:100vh;
}
h1,h2{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding:0 28px;width:100%}

/* header */
.top{background:var(--steel);color:#fff;border-bottom:3px solid var(--signal)}
.top .wrap{display:flex;align-items:center;gap:22px;height:66px;max-width:1120px}
.mark{display:flex;align-items:baseline;gap:9px;text-decoration:none}
.mark .q{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:27px;letter-spacing:.02em;color:#fff}
.mark .s{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:27px;color:var(--signal)}
.back{margin-left:auto;font-size:14.5px;font-weight:500;color:#D8E2E7;text-decoration:none;
      border-bottom:2px solid transparent;padding:4px 0}
.back:hover{color:#fff;border-bottom-color:var(--signal)}
.top nav a.navchat{
  border:1px solid #3A4E59;border-radius:3px;padding:5px 12px;color:#fff;
}
.top nav a.navchat[aria-current="page"]{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.lang{display:flex;flex:none}
.lang button{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;
  background:transparent;color:#AFC0C8;border:1px solid #3A4E59;padding:5px 11px;cursor:pointer;
}
.lang button + button{border-left:0}
.lang button:first-child{border-radius:3px 0 0 3px}
.lang button:last-child{border-radius:0 3px 3px 0}
.lang button[aria-pressed="true"]{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]:hover{color:var(--ink)}

/* body */
main{flex:1;padding:64px 0 88px}
h1{font-size:clamp(34px,5vw,54px);text-transform:uppercase;margin-bottom:16px}
.lede{font-size:18px;font-weight:500;color:#000;max-width:58ch;margin:0 0 34px}
.panel{
  border:1px solid var(--line);border-top:3px solid var(--signal);
  border-radius:4px;padding:26px 28px 28px;background:var(--concrete-dim);
}
.panel h2{font-size:24px;text-transform:uppercase;margin-bottom:10px}
.panel p{margin:0 0 14px;color:#000;font-size:17px;font-weight:500}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{padding:9px 0;border-top:1px solid var(--line);color:#000;font-size:17px;font-weight:500}
.callout{
  display:inline-block;margin-top:20px;background:var(--steel);color:#fff;
  font-size:15px;padding:11px 16px;border-radius:3px;text-decoration:none;
}
.callout b{color:var(--signal);font-weight:600}
.callout:hover{background:var(--steel-deep)}

footer{background:var(--steel-deep);color:#AFC0C8;padding:34px 0 40px;font-size:14.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:baseline;max-width:1120px}
footer a{color:#D2DEE4;text-decoration:none}
footer a:hover{color:#fff}
footer .sp{margin-left:auto}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="mark" href="index.html"><span class="q">QWIK</span><span class="s">SERVICE</span></a>
    <a class="back" href="index.html" data-i18n="back"></a>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button type="button" id="lang-en" onclick="setLang('en')" aria-pressed="true">EN</button>
      <button type="button" id="lang-es" onclick="setLang('es')" aria-pressed="false">ES</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>

    <div class="panel">
      <h2 data-i18n="panel.h"></h2>
      <p data-i18n="panel.p"></p>
      <ul>
        <li data-i18n="panel.1"></li>
        <li data-i18n="panel.2"></li>
        <li data-i18n="panel.3"></li>
        <li data-i18n="panel.4"></li>
      </ul>
      <a class="callout" href="index.html#book" data-i18n-html="panel.call"></a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span data-i18n="ft.tag"></span>
    <span class="sp"><a href="index.html" data-i18n="ft.home"></a></span>
    <span><a href="index.html#centres" data-i18n="ft.find"></a></span>
  </div>
</footer>

<script>
var I18N = {
  en: {
    "back":"Back to the main site",
    "h1":"Web chat",
    "lede":"The same assistant that answers the phone, in text. Book, change, check or cancel an appointment, or ask a question about our services.",
    "panel.h":"Before you start",
    "panel.p":"The chat window is in the bottom corner of this page. To discuss an existing appointment you will need:",
    "panel.1":"Your vehicle licence plate",
    "panel.2":"The postal code on your account",
    "panel.3":"The phone number registered to the account, if we do not recognise you",
    "panel.4":"Say \u201cSpanish\u201d at any point to continue in Spanish",
    "panel.call":"Prefer to talk? <b>Call us from the main site</b>",
    "ft.tag":"Qwik Service \u2014 vehicle servicing, repairs and safety inspections",
    "ft.home":"Main site", "ft.find":"Find a centre",
    "title":"Qwik Service \u2014 Web chat"
  },
  es: {
    "back":"Volver al sitio principal",
    "h1":"Chat web",
    "lede":"El mismo asistente que responde al tel\u00e9fono, por escrito. Reserve, cambie, consulte o cancele una cita, o pregunte lo que necesite sobre nuestros servicios.",
    "panel.h":"Antes de empezar",
    "panel.p":"La ventana de chat est\u00e1 en la esquina inferior de esta p\u00e1gina. Para consultar una cita existente necesitar\u00e1:",
    "panel.1":"La matr\u00edcula de su veh\u00edculo",
    "panel.2":"El c\u00f3digo postal de su cuenta",
    "panel.3":"El tel\u00e9fono registrado en la cuenta, si no le reconocemos",
    "panel.4":"Diga \u201cEnglish\u201d en cualquier momento para continuar en ingl\u00e9s",
    "panel.call":"\u00bfPrefiere hablar? <b>Ll\u00e1menos desde el sitio principal</b>",
    "ft.tag":"Qwik Service \u2014 mantenimiento, reparaciones e inspecci\u00f3n t\u00e9cnica",
    "ft.home":"Sitio principal", "ft.find":"Encontrar un centro",
    "title":"Qwik Service \u2014 Chat web"
  }
};

function applyLang(lang){
  var d = I18N[lang] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    if (d[k] !== undefined) el.textContent = d[k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){
    var k = el.getAttribute('data-i18n-html');
    if (d[k] !== undefined) el.innerHTML = d[k];
  });
  document.documentElement.lang = lang;
  document.title = d["title"];
  document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
  document.getElementById('lang-es').setAttribute('aria-pressed', lang === 'es');
}

function setLang(lang){
  applyLang(lang);
  try { localStorage.setItem('qwikLang', lang); } catch (e) {}
}

(function initLang(){
  var saved = null;
  try { saved = localStorage.getItem('qwikLang'); } catch (e) {}
  var browser = (navigator.language || 'en').toLowerCase().slice(0,2);
  applyLang(saved || (browser === 'es' ? 'es' : 'en'));
})();
</script>

<!-- ================= Cognigy Webchat =================
     Lives on this page only. The Click To Call widget on index.html
     bundles its own copy of Preact and the two clash when loaded
     together, so they are kept on separate pages.
     ==================================================== -->
<script src="webchat.js"></script>
<script>
  initWebchat(
    "https://endpoint-trial.cognigy.ai/60728bf34d391e019932b569dd6078a8d0bd1cce100154c801df3e3a98b8e4f0"
  );
</script>
</body>
</html>
